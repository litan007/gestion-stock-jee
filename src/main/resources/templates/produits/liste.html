<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Produits</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div class="container mt-4">
    <div th:replace="~{fragments/messages :: messages}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Liste des produits</h3>
        <a sec:authorize="hasRole('ADMIN')" class="btn btn-primary" th:href="@{/produits/ajouter}">Ajouter</a>
    </div>

    <form class="row g-2 mb-3" method="get" th:action="@{/produits}">
        <div class="col-md-5"><input class="form-control" name="terme" th:value="${terme}" placeholder="Nom ou référence"></div>
        <div class="col-md-3">
            <select class="form-select" name="categorie">
                <option value="">Toutes catégories</option>
                <option th:each="c: ${categories}" th:value="${c}" th:text="${c}" th:selected="${c == categorie}"></option>
            </select>
        </div>
        <div class="col-md-2">
            <select class="form-select" name="etat">
                <option value="">Tous états</option>
                <option value="DISPONIBLE" th:selected="${etat == 'DISPONIBLE'}">Disponible</option>
                <option value="FAIBLE" th:selected="${etat == 'FAIBLE'}">Faible</option>
                <option value="RUPTURE" th:selected="${etat == 'RUPTURE'}">Rupture</option>
            </select>
        </div>
        <div class="col-md-2"><button class="btn btn-outline-primary w-100">Filtrer</button></div>
    </form>

    <table class="table table-striped table-hover">
        <thead><tr><th>Réf</th><th>Nom</th><th>Catégorie</th><th>Prix</th><th>Qté</th><th>État</th><th>Actions</th></tr></thead>
        <tbody>
        <tr th:each="p : ${produits.content}">
            <td th:text="${p.reference}"></td>
            <td th:text="${p.nom}"></td>
            <td th:text="${p.categorie}"></td>
            <td th:text="${#numbers.formatDecimal(p.prix,1,2)} + ' €'"></td>
            <td th:text="${p.quantite}"></td>
            <td><span class="badge" th:classappend="${p.etatStock.name() == 'RUPTURE'} ? ' bg-danger' : (${p.etatStock.name() == 'FAIBLE'} ? ' bg-warning text-dark' : ' bg-success')" th:text="${p.etatStock}"></span></td>
            <td>
                <a class="btn btn-sm btn-outline-info" th:href="@{/produits/detail/{id}(id=${p.id})}">Voir</a>
                <a sec:authorize="hasRole('ADMIN')" class="btn btn-sm btn-outline-secondary" th:href="@{/produits/editer/{id}(id=${p.id})}">Éditer</a>
                <form sec:authorize="hasRole('ADMIN')" th:action="@{/produits/supprimer/{id}(id=${p.id})}" method="post" class="d-inline">
                    <button class="btn btn-sm btn-outline-danger" onclick="return confirm('Supprimer ce produit ?')">Supprimer</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
