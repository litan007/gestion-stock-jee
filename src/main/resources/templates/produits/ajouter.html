<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ajouter produit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div class="container mt-4">
    <h3>Ajouter un produit</h3>
    <form th:action="@{/produits/ajouter}" th:object="${produit}" method="post" class="row g-3" novalidate>
        <div class="col-md-6"><label class="form-label">Nom</label><input class="form-control" th:field="*{nom}" required><div class="text-danger" th:errors="*{nom}"></div></div>
        <div class="col-md-6"><label class="form-label">Référence</label><input class="form-control" th:field="*{reference}" required><div class="text-danger" th:errors="*{reference}"></div></div>
        <div class="col-md-6"><label class="form-label">Catégorie</label><input class="form-control" th:field="*{categorie}" required><div class="text-danger" th:errors="*{categorie}"></div></div>
        <div class="col-md-6"><label class="form-label">Fournisseur</label><input class="form-control" th:field="*{fournisseur}" required><div class="text-danger" th:errors="*{fournisseur}"></div></div>
        <div class="col-md-4"><label class="form-label">Prix</label><input class="form-control" th:field="*{prix}" type="number" min="0.01" step="0.01" required><div class="text-danger" th:errors="*{prix}"></div></div>
        <div class="col-md-4"><label class="form-label">Quantité</label><input class="form-control" th:field="*{quantite}" type="number" min="0" required><div class="text-danger" th:errors="*{quantite}"></div></div>
        <div class="col-md-4"><label class="form-label">Seuil mini</label><input class="form-control" th:field="*{quantiteMinimale}" type="number" min="0" required><div class="text-danger" th:errors="*{quantiteMinimale}"></div></div>
        <div class="col-12"><label class="form-label">Description</label><textarea class="form-control" th:field="*{description}" rows="3"></textarea></div>
        <div class="col-12"><button class="btn btn-primary">Enregistrer</button> <a class="btn btn-secondary" th:href="@{/produits}">Annuler</a></div>
    </form>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
