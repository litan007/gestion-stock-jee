<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div class="container mt-4">
    <h2>Bienvenue, <span th:text="${username}"></span></h2>
    <div class="row mt-4">
        <div class="col-md-4"><div class="card border-primary"><div class="card-body"><h5>Total produits</h5><p class="display-6" th:text="${totalProduits}"></p></div></div></div>
        <div class="col-md-4"><div class="card border-warning"><div class="card-body"><h5>Stock faible</h5><p class="display-6" th:text="${stocksFaibles}"></p></div></div></div>
        <div class="col-md-4"><div class="card border-danger"><div class="card-body"><h5>Ruptures</h5><p class="display-6" th:text="${ruptures}"></p></div></div></div>
    </div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
